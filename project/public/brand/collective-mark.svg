<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="36 4 470 540" width="470" height="540" role="img" aria-labelledby="title">
  <title id="title">Collective mark</title>
  <defs>
    <linearGradient id="logo-gradient" gradientUnits="userSpaceOnUse" x1="36" y1="4" x2="506" y2="544">
      <stop offset="0%" stop-color="#4e248c">
        <animate attributeName="stop-color" values="#4e248c;#012b5e;#04bfbf;#ff903e;#ff594b;#4e248c;#012b5e;#04bfbf;#ff903e;#ff594b" dur="90s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff594b">
